<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Coffee Cart · Jev 多意图点单</title>
    <meta
      name="description"
      content="对话框点单 → 小票逐步填满。演示 Jev Choice 循环与多意图购物车。"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css?v=e734046" />
  </head>
  <body>
    <main class="stage">
      <section class="dialog" id="dialog" aria-labelledby="dialog-title">
        <p class="dialog__eyebrow">Jev · 多意图</p>
        <h1 class="dialog__title" id="dialog-title">今天喝点什么？</h1>
        <p class="dialog__lede">选一句点单，模型会按意图逐件写入小票。</p>
        <div class="dialog__choices" role="group" aria-label="点单选项">
          <button type="button" class="choice" data-request="来两杯燕麦拿铁，再来个麦芬">
            两杯燕麦拿铁，再来个麦芬
          </button>
          <button type="button" class="choice" data-request="美式热的，再来热巧克力">
            美式热的，再来热巧克力
          </button>
          <button type="button" class="choice" data-request="那个绿色抹茶拿铁">
            那个绿色抹茶拿铁
          </button>
          <button type="button" class="choice" data-request="来一杯拿铁">
            来一杯拿铁
          </button>
        </div>
        <p class="dialog__note">菜单无抹茶；菜单外意图会空票收场。</p>
      </section>

      <article class="ticket" id="ticket" hidden aria-live="polite" aria-labelledby="ticket-title">
        <div class="ticket__top">
          <h2 class="ticket__title" id="ticket-title">点单小票</h2>
          <button type="button" class="ticket__back" id="ticket-back">再点一次</button>
        </div>
        <p class="ticket__request" id="ticket-request"></p>
        <hr class="ticket__rule" />
        <ul class="ticket__lines" id="ticket-lines"></ul>
      </article>
    </main>
    <script src="/app.js?v=e734046" type="module"></script>
  </body>
</html>
